name: Go Tests
on:
  push:
    branches:
      - "main"
      - "release/**"

  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
      - "**.go"
      - "go.*"
      - "Makefile"
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install dependencies
        run: |
          go mod tidy
          git diff --exit-code ||
            (echo "go.mod or go.sum has changed. Please run 'go mod tidy' and commit the changes." && exit 1)

      - name: Run tests
        run: make test

      - name: Build
        run: make build
    timeout-minutes: 15
